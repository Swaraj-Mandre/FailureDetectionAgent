<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/>
    </marker>
    <style>
      .panel { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
      .box { fill: #f5f7f9; stroke: #4b5563; stroke-width: 1.4; }
      .key { fill: #ffffff; stroke: #1f5f8b; stroke-width: 2.4; }
      .store { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .pill { fill: #ffffff; stroke: #4b5563; stroke-width: 1.4; }
      .line { fill: none; stroke: #4b5563; stroke-width: 1.5; marker-end: url(#arrow); }
      .fail { fill: none; stroke: #1f5f8b; stroke-width: 1.6; marker-end: url(#arrow-accent); }
      .title { font-size: 19px; font-weight: 600; fill: #1f2933; }
      .sub { font-size: 13px; fill: #6b7280; }
      .name { font-size: 15px; font-weight: 600; fill: #1f2933; }
      .note { font-size: 12px; fill: #6b7280; }
      .edge { font-size: 12px; fill: #4b5563; }
      .edge-accent { font-size: 12px; fill: #1f5f8b; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- ============ PBA 1 ============ -->
  <rect class="panel" x="16" y="16" width="380" height="608" rx="10"/>
  <text class="title" x="36" y="48">PBA 1: one agent</text>
  <text class="sub" x="36" y="68">manual StateGraph, Unit II Session 4</text>

  <rect class="pill" x="96" y="92" width="88" height="30" rx="15"/>
  <text class="name" x="140" y="112" text-anchor="middle">START</text>
  <rect class="pill" x="250" y="92" width="88" height="30" rx="15"/>
  <text class="name" x="294" y="112" text-anchor="middle">END</text>

  <rect class="box" x="86" y="160" width="190" height="58" rx="8"/>
  <text class="name" x="181" y="184" text-anchor="middle">agent</text>
  <text class="note" x="181" y="204" text-anchor="middle">qwen2.5:3b with run_sql</text>

  <rect class="box" x="86" y="270" width="190" height="58" rx="8"/>
  <text class="name" x="181" y="294" text-anchor="middle">tools</text>
  <text class="note" x="181" y="314" text-anchor="middle">read-only SQL on shop.db</text>

  <rect class="key" x="86" y="380" width="190" height="58" rx="8"/>
  <text class="name" x="181" y="404" text-anchor="middle">route_after_tools</text>
  <text class="note" x="181" y="424" text-anchor="middle">did the tool fail?</text>

  <rect class="box" x="86" y="490" width="190" height="58" rx="8"/>
  <text class="name" x="181" y="514" text-anchor="middle">handle_failure</text>
  <text class="note" x="181" y="534" text-anchor="middle">typed hint, 3 failures max</text>

  <path class="line" d="M140,122 L140,158"/>
  <path class="line" d="M240,160 L280,124"/>
  <text class="edge" x="270" y="150">final answer</text>
  <path class="line" d="M181,218 L181,268"/>
  <text class="edge" x="190" y="248">tool call</text>
  <path class="line" d="M181,328 L181,378"/>
  <path class="line" d="M86,409 L56,409 L56,189 L84,189"/>
  <text class="edge" x="46" y="300" transform="rotate(-90 46 300)" text-anchor="middle">ok</text>
  <path class="fail" d="M181,438 L181,488"/>
  <text class="edge-accent" x="190" y="468">error</text>
  <path class="fail" d="M276,519 L330,519 L330,200 L278,200"/>
  <text class="edge-accent" x="342" y="360" transform="rotate(90 342 360)" text-anchor="middle">try again, or stop</text>

  <text class="note" x="36" y="596">Unsafe and unreachable cases lock the tool.</text>
  <text class="note" x="36" y="612">The agent then explains instead of retrying.</text>

  <!-- ============ PBA 2 ============ -->
  <rect class="panel" x="412" y="16" width="772" height="608" rx="10"/>
  <text class="title" x="432" y="48">PBA 2: Executor, Monitor and Recovery</text>
  <text class="sub" x="432" y="68">one shared message history, retry budget of 3 per question</text>

  <!-- row 1 -->
  <rect class="box" x="450" y="130" width="190" height="62" rx="8"/>
  <text class="name" x="545" y="156" text-anchor="middle">Executor</text>
  <text class="note" x="545" y="176" text-anchor="middle">qwen2.5:3b, writes the SQL</text>

  <rect class="box" x="700" y="130" width="190" height="62" rx="8"/>
  <text class="name" x="795" y="156" text-anchor="middle">run_sql tool</text>
  <text class="note" x="795" y="176" text-anchor="middle">read-only, one SELECT</text>

  <rect class="key" x="950" y="130" width="200" height="62" rx="8"/>
  <text class="name" x="1050" y="156" text-anchor="middle">Monitor</text>
  <text class="note" x="1050" y="176" text-anchor="middle">plain rules, no LLM</text>

  <path class="line" d="M640,161 L698,161"/>
  <path class="line" d="M890,161 L948,161"/>
  <path class="line" d="M1050,130 L1050,100 L545,100 L545,128"/>
  <text class="edge" x="797" y="93" text-anchor="middle">result looks fine</text>

  <!-- row 2 -->
  <rect class="box" x="700" y="285" width="190" height="62" rx="8"/>
  <text class="name" x="795" y="311" text-anchor="middle">Privacy gate</text>
  <text class="note" x="795" y="331" text-anchor="middle">a person approves or masks</text>

  <rect class="key" x="950" y="285" width="200" height="62" rx="8"/>
  <text class="name" x="1050" y="311" text-anchor="middle">Recovery</text>
  <text class="note" x="1050" y="331" text-anchor="middle">rules + error guide RAG</text>

  <path class="line" d="M985,192 L870,283"/>
  <text class="edge" x="905" y="228">personal data</text>
  <path class="line" d="M720,285 L610,194"/>
  <text class="edge" x="662" y="232">approved or masked</text>
  <path class="fail" d="M1050,192 L1050,283"/>
  <text class="edge-accent" x="1060" y="230">tool error or</text>
  <text class="edge-accent" x="1060" y="245">bad result:</text>
  <text class="edge-accent" x="1060" y="260">quarantined</text>

  <path class="fail" d="M990,347 L990,390 L600,390 L600,194"/>
  <text class="edge-accent" x="795" y="383" text-anchor="middle">advice, retries left</text>

  <!-- row 3 -->
  <rect class="box" x="450" y="430" width="190" height="50" rx="8"/>
  <text class="name" x="545" y="452" text-anchor="middle">Answer to the user</text>
  <text class="note" x="545" y="470" text-anchor="middle">checked against the rows</text>
  <path class="line" d="M510,192 L510,428"/>
  <text class="edge" x="502" y="320" transform="rotate(-90 502 320)" text-anchor="middle">final answer, via Monitor</text>

  <rect class="box" x="1000" y="430" width="150" height="50" rx="8"/>
  <text class="name" x="1075" y="452" text-anchor="middle">Safe stop</text>
  <text class="note" x="1075" y="470" text-anchor="middle">says why, never guesses</text>
  <path class="fail" d="M1110,347 L1110,428"/>
  <text class="edge-accent" x="1102" y="400" text-anchor="end">budget used</text>
  <text class="edge-accent" x="1102" y="414" text-anchor="end">or not retryable</text>

  <!-- memory and RAG -->
  <text class="sub" x="450" y="520">Unit 3 layer, all on local disk</text>
  <rect class="store" x="450" y="532" width="160" height="72" rx="8"/>
  <text class="name" x="530" y="556" text-anchor="middle">Checkpointer</text>
  <text class="note" x="530" y="574" text-anchor="middle">per thread_id</text>
  <text class="note" x="530" y="590" text-anchor="middle">resume after a crash</text>

  <rect class="store" x="626" y="532" width="160" height="72" rx="8"/>
  <text class="name" x="706" y="556" text-anchor="middle">Store</text>
  <text class="note" x="706" y="574" text-anchor="middle">glossary per user</text>
  <text class="note" x="706" y="590" text-anchor="middle">survives a restart</text>

  <rect class="store" x="802" y="532" width="160" height="72" rx="8"/>
  <text class="name" x="882" y="556" text-anchor="middle">Failure log</text>
  <text class="note" x="882" y="574" text-anchor="middle">SQLite, one row</text>
  <text class="note" x="882" y="590" text-anchor="middle">per failure</text>

  <rect class="store" x="978" y="532" width="172" height="72" rx="8"/>
  <text class="name" x="1064" y="556" text-anchor="middle">Error guide (Chroma)</text>
  <text class="note" x="1064" y="574" text-anchor="middle">15 sections, k=3</text>
  <text class="note" x="1064" y="590" text-anchor="middle">nomic-embed-text</text>
</svg>
